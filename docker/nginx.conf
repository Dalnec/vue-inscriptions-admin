server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos normalmente
    location ~* ^.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|html)$ {
        try_files $uri =404;
    }

    # ── Pre-render para crawlers de redes sociales ──
    location / {
        # Detectar si es un crawler
        set $is_crawler 0;
        if ($http_user_agent ~* "googlebot|bingbot|yandex|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slack|slackbot|vkShare|Discord|Pinterest|embedly|prerender") {
            set $is_crawler 1;
        }
        if ($args ~ "_escaped_fragment_") {
            set $is_crawler 1;
        }

        # Si es crawler, redirigir a prerender-node
        if ($is_crawler = 1) {
            # Usar proxy_pass directo a prerender-node
            proxy_pass http://127.0.0.1:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header User-Agent $http_user_agent;
            
            # Importante: No usar rewrite con proxy_pass
            break;
        }

        # Si no es crawler, servir SPA normalmente
        try_files $uri $uri/ /index.html;
    }
}