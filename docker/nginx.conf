server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos normalmente
    location ~* ^.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|html)$ {
        try_files $uri =404;
    }

    # ── Pre-render para crawlers de redes sociales ──
    location / {
        # Detectar si es un crawler
        set $is_crawler 0;
        if ($http_user_agent ~* "googlebot|bingbot|yandex|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slack|slackbot|vkShare|Discord|Pinterest|embedly|prerender") {
            set $is_crawler 1;
        }
        if ($args ~ "_escaped_fragment_") {
            set $is_crawler 1;
        }

        # Si es crawler, redirigir a prerender-node con mejor manejo de errores
        if ($is_crawler = 1) {
            # Usar proxy_pass con mejor manejo de errores
            proxy_pass http://127.0.0.1:3000;
            
            # Headers importantes
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header User-Agent $http_user_agent;
            
            # Configuración de proxy más robusta
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_redirect off;
            
            # Manejo de errores
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_tries 3;
            proxy_next_upstream_timeout 30s;
        }

        # Si no es crawler, servir SPA normalmente
        try_files $uri $uri/ /index.html;
    }

    # ── Health check endpoint ──
    location /health {
        access_log off;
        return 200 "healthy\n";
    }

    # ── Error handler ──
    error_page 502 503 504 /error.html;
    location = /error.html {
        internal;
        return 502 'Servicio no disponible temporalmente. Por favor, intente más tarde.';
    }
}