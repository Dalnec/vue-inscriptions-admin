server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    location / {

        set $prerender 0;

        if ($http_user_agent ~* "googlebot|bingbot|facebookexternalhit|twitterbot|whatsapp|telegrambot") {
            set $prerender 1;
        }

        if ($args ~ "_escaped_fragment_") {
            set $prerender 1;
        }

        if ($prerender = 1) {
            proxy_pass https://service.prerender.io/$scheme://$host$request_uri;

            proxy_set_header X-Prerender-Token TU_TOKEN;
            proxy_set_header Host service.prerender.io;
            proxy_ssl_server_name on;
            break;
        }

        try_files $uri $uri/ /index.html;
    }
}