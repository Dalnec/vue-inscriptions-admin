server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos normalmente
    location ~* ^.*\.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|html)$ {
        try_files $uri =404;
    }

    # ── Pre-render para crawlers de redes sociales ──
    location / {
        # Detectar si es un crawler
        set $is_crawler 0;
        if ($http_user_agent ~* "googlebot|bingbot|yandex|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slack|slackbot|vkShare|Discord|Pinterest|embedly|prerender") {
            set $is_crawler 1;
        }
        if ($args ~ "_escaped_fragment_") {
            set $is_crawler 1;
        }

        # Si es crawler, redirigir a prerender-node (location separado)
        if ($is_crawler = 1) {
            # Este if es solo para detección, no para proxy directives
            return 302 http://127.0.0.1:3000$request_uri;
        }

        # Si no es crawler, servir SPA normalmente
        try_files $uri $uri/ /index.html;
    }
}