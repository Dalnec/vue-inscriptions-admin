server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = / {
        return 302 /administrador/;
    }

    location /administrador/assets/ {
        try_files $uri =404;
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /administrador/ {
        try_files $uri $uri/ /administrador/index.html;
    }
}
