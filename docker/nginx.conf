server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Servir archivos estáticos
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA + Prerender.io para crawlers
    location / {
        # Detectar crawlers
        set $is_crawler 0;
        if ($http_user_agent ~* "googlebot|bingbot|yandex|facebookexternalhit|twitterbot|linkedinbot|whatsapp|telegrambot|slack|slackbot|vkShare|Discord|Pinterest|embedly|prerender") {
            set $is_crawler 1;
        }
        if ($args ~ "_escaped_fragment_") {
            set $is_crawler 1;
        }

        # Crawlers -> prerender.io
        if ($is_crawler = 1) {
            proxy_pass https://service.prerender.io;
            proxy_set_header X-Prerender-Token PQyObZbSCs8Io482O4Fv;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header User-Agent $http_user_agent;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Usuarios normales -> SPA
        try_files $uri $uri/ /index.html;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "ok\n";
    }
}