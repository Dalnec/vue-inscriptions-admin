name: Deploy Demo Admin Web

on:
  push:
    branches:
      - codexdeploy
  workflow_dispatch:

concurrency:
  group: deploy-demo-admin-web
  cancel-in-progress: true

jobs:
  deploy-demo-admin-web:
    name: Deploy Demo Admin Web
    runs-on: ubuntu-latest
    steps:
      - name: Deploy admin frontend demo via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            set -e
            sudo -n /usr/local/bin/deploy_jni_demo_admin_web.sh codexdeploy
